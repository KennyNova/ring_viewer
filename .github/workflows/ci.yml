name: CI

# Checks only. Deploys are handled by Coolify, which pulls from GitHub on the Raspberry Pi.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          # puppeteer (dev dependency) is only used to render thumbnails on a PC. Its Chromium
          # download made installs take ~5 minutes, and one run hung until the 15 minute timeout.
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
